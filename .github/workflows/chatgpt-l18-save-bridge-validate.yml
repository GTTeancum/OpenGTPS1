name: ChatGPT L18 save bridge validation

on:
  push:
    branches:
      - chatgpt/l18-runtime-recovery

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Python syntax
        run: python3 -m py_compile tools/apply_gt2_arcade_enhancements.py

      - name: Save bridge source contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          compat = Path("vendor/RecompOne/RecompOne.Runtime/sdk/GT2Compat.cs").read_text()
          patcher = Path("tools/apply_gt2_arcade_enhancements.py").read_text()
          tests = Path("tools/modern-renderer-config-tests/Program.cs").read_text()
          assert compat.count("public static bool CaptureArcadeSaveWrite(") == 1
          assert compat.count("public static bool CompleteArcadeSaveWrite()") == 1
          assert "RECOMPONE_GT2_ARCADE_SAVE_BRIDGE" in compat
          assert "card.Flush();" in compat
          assert patcher.count("GT2Compat.CaptureArcadeSaveWrite(") == 1
          assert patcher.count("GT2Compat.CompleteArcadeSaveWrite();") == 1
          assert "GranTurismo2ArcadePC.func_8006A124(c, m);" not in patcher
          assert "Arcade Save Game persistence bridge no longer" in tests
          print("Arcade save bridge source contract: PASS")
          PY

      - name: Build RecompOne runtime
        run: dotnet build vendor/RecompOne/RecompOne.Runtime/RecompOne.Runtime.csproj -c Release -p:OpenGTLinuxHost=true

      - name: Build renderer contract tests
        run: dotnet build tools/modern-renderer-config-tests/ModernRendererConfigTests.csproj -c Release -p:OpenGTLinuxHost=true

      - name: Run Arcade save bridge persistence regression
        id: bridge_test
        shell: bash
        run: |
          set +e
          dotnet run --project tools/arcade-save-bridge-tests/ArcadeSaveBridgeTests.csproj -c Release -p:OpenGTLinuxHost=true > bridge-test.log 2>&1
          rc=$?
          cat bridge-test.log
          message=$(grep -E 'error CS|Unhandled exception|InvalidOperationException|Exception:' bridge-test.log | tail -n 1 | tr '\n' ' ' | cut -c1-105)
          if [ -z "$message" ]; then
            message=$(tail -n 1 bridge-test.log | tr '\n' ' ' | cut -c1-105)
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "message=$message" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish validation status
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          BRIDGE_RC: ${{ steps.bridge_test.outputs.rc }}
          BRIDGE_MESSAGE: ${{ steps.bridge_test.outputs.message }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          rc = os.environ.get("BRIDGE_RC", "")
          import re

          if rc == "0":
              state = "success"
              context = "chatgpt/l18-save-bridge"
              description = "L18 save bridge compile and persistence regression passed"
          elif rc:
              state = "failure"
              detail = os.environ.get("BRIDGE_MESSAGE", "").strip()
              signature = re.sub(r"[^A-Za-z0-9_.-]+", "-", detail).strip("-")[:64]
              context = "chatgpt/l18-save-bridge/" + (signature or "test-failed")
              description = ("save bridge test: " + detail)[:140]
          else:
              state = "failure"
              context = "chatgpt/l18-save-bridge/pre-test-failure"
              description = "L18 save bridge validation stopped before persistence test"
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/statuses/{os.environ['SHA']}",
              data=json.dumps({
                  "state": state,
                  "context": context,
                  "description": description,
              }).encode(),
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(request) as response:
              print(response.read().decode())
          PY
