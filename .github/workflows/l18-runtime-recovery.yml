name: L18 exact font export

on:
  push:
    branches:
      - chatgpt/l18-runtime-recovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-fonts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact historical font resources
        shell: bash
        run: |
          set -euxo pipefail
          echo "ed9bee1f62504a8e263eaebfac2077f88ff5a05b2efeaefa724a7103e533b15c  vendor/RecompOne/RecompOne.Runtime/Bios/Fonts/font1.raw" | sha256sum -c -
          echo "cd248f7d47a37ce0338e59320675e3595698c7512f969d8ac38cb34ecc80619f  vendor/RecompOne/RecompOne.Runtime/Bios/Fonts/font2.raw" | sha256sum -c -

      - name: Upload exact fonts
        uses: actions/upload-artifact@v4
        with:
          name: OpenGT-L18-exact-fonts
          path: |
            vendor/RecompOne/RecompOne.Runtime/Bios/Fonts/font1.raw
            vendor/RecompOne/RecompOne.Runtime/Bios/Fonts/font2.raw
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
